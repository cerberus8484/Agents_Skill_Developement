name: Nexora quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nexora-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check generated agents
        run: python tools/sync_agents.py --check

      - name: Check generated skills
        run: python tools/sync_skills.py --check

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Nexora Agent Bench baseline
        run: python tools/run_benchmark.py --suite benchmarks/cases --responses benchmarks/fixtures/baseline
